# Taxonomy: Healthcare (Y tế / Sức khoẻ)
# ------------------------------------------------------------------
# UI tiếng Anh (name), nội dung matching tiếng Việt (aliases, keywords).
#
# Quy tắc alias cho bệnh viện:
#  - Tên trùng từ thông dụng / tên người / tên đường => BẮT BUỘC kèm "bệnh viện"/"bv":
#    "hùng vương", "thống nhất", "hồng ngọc", "tâm anh", "hoàn mỹ", "hạnh phúc", "108", "115", "k", "e"
#  - Người dùng hay viết tắt "bv" -> thêm alias "bv <tên>".
#  - Bệnh viện nước ngoài: thêm cả tên tiếng Anh lẫn cách người Việt hay gọi.
#
# meta: thông tin hiển thị trên dashboard (country, city, type, specialty).
# ⚠ Thông tin meta được tổng hợp sẵn – nên rà soát lại trước khi dùng cho báo cáo chính thức.
# ------------------------------------------------------------------
