  - mua ở đâu

# Từ vựng sentiment đặc thù ngành (cộng thêm vào từ điển chung)
sentiment:
  positive:
    - tăng cân
    - lên cân
    - ngủ ngon
    - mát
    - thấm hút tốt
    - mỏng nhẹ
    - không hăm
    - hợp với bé
    - uống ngon
    - bé thích
    - tiêu hoá tốt
    - đi ngoài đều
    - chống sặc tốt
  negative:
    - sữa giả
    - táo bón
    - tiêu chảy
    - nôn trớ
    - dị ứng
    - nổi mẩn
    - hăm
    - hăm tã
    - tràn
    - bị tràn
    - xì
    - sụt cân
    - biếng ăn
    - vón cục
    - sặc

# Từ khoá hoạt động MKT đặc thù ngành (cộng thêm vào bộ chung)
activity_terms:
  su_kien_offline:
    - hội thảo tiền sản
    - lớp học tiền sản
    - ngày hội mẹ và bé
    - dùng thử miễn phí tại siêu thị
  csr:
    - tặng sữa
    - quỹ sữa

# Tier HOURLY: chỉ những query "nóng" để không bị rate-limit
hourly_keywords:
  - sữa giả
  - thu hồi sữa
  - sữa bột ngộ độc
  - bỉm kém chất lượng
  - bóc phốt sữa

