# Free always-on collector: GitHub Actions runs VN Listen on a schedule and keeps the SQLite database
# on the `data` branch (one force-pushed commit, so the repo never grows with history).
# Free quota for PRIVATE repos = 2,000 minutes/month. This schedule uses ≈1,200: crisis scan every 2 hours
# (~2 min) + one full daily run (~12–15 min). Keep it that way, or the runs stop until next month.
name: Collect data

on:
  schedule:
    - cron: "7 */2 * * *"     # every 2 hours – crisis keywords + alerts
    - cron: "23 23 * * *"     # 06:23 Vietnam time – full daily run (news, YouTube, Tiki, keywords, insights)
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [daily, hourly]
        default: daily

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Restore database from the data branch
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:vnlisten.db > data/vnlisten.db && echo "Restored $(du -h data/vnlisten.db | cut -f1)"
          else
            echo "No data branch yet – starting with an empty database"
          fi

      - name: Collect
        env:
          VNLISTEN_DB: ${{ github.workspace }}/data/vnlisten.db
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            if [ "${{ github.event.schedule }}" = "23 23 * * *" ]; then JOB=daily; else JOB=hourly; fi
          fi
          echo "Running: vnlisten $JOB"
          vnlisten "$JOB"

      - name: Save database to the data branch
        if: always()
        run: |
          [ -f data/vnlisten.db ] || { echo "No database produced"; exit 0; }
          mkdir -p /tmp/datarepo && cp data/vnlisten.db /tmp/datarepo/
          cd /tmp/datarepo
          git init -q -b data
          git config user.name "vnlisten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vnlisten.db
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          echo "Saved $(du -h vnlisten.db | cut -f1) to the data branch"
