<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VN Listen – Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside style="width: 280px; min-height: 100%; padding: 28px 22px; display: flex; flex-direction: column; gap: 26px; background: rgba(255,255,255,0.62); border-right: 1px solid rgba(255,255,255,0.9); font-family: Montserrat, system-ui, sans-serif; color: #101828">
  <div style="display: flex; align-items: center; gap: 12px">
    <span class="tile" style="flex: 0 0 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #ffffff; background: linear-gradient(135deg, {{accent}} 0%, #8cc8fb 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 8px 20px rgba(47,91,234,0.3)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l3-7 4 14 3-7h5"></path></svg></span>
    <div><div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em">VN Listen</div><div style="font-size: 11px; font-weight: 500; color: #5b6478">Listening &amp; research</div></div>
  </div>
  <label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 500; color: #5b6478">Industry
    <select style="height: 46px; border-radius: 14px; border: 1px solid rgba(47,91,234,0.18); background: rgba(255,255,255,0.9); padding: 0 12px; font-family: Montserrat, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #101828">
      <sc-for list="{{industries}}" as="ind" hint-placeholder-count="2"><sc-if value="{{ind.on}}" hint-placeholder-val="{{false}}"><option selected="selected">{{ind.label}}</option></sc-if><sc-if value="{{ind.off}}" hint-placeholder-val="{{true}}"><option>{{ind.label}}</option></sc-if></sc-for>
    </select>
  </label>
  <nav aria-label="Modules" style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; font-weight: 500; color: #5b6478; margin-bottom: 2px">Module</div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" class="btn" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border-radius: 16px; background: {{n.bg}}; color: {{n.ink}}; text-decoration: none; font-size: 14px; font-weight: {{n.weight}}; box-shadow: {{n.shadow}}">
        <span class="tile" style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{n.color}}; background: linear-gradient(150deg, #ffffff 0%, {{n.tint}} 100%); border: 1px solid rgba(255,255,255,0.95); box-shadow: inset 0 1px 0 #ffffff, inset 0 -5px 10px {{n.inner}}, 0 8px 18px {{n.tint}}"><sc-if value="{{n.ic_listening}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.2"></circle><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 15.8a5.4 5.4 0 0 0 0-7.6M5.2 5.2a9.6 9.6 0 0 0 0 13.6M18.8 18.8a9.6 9.6 0 0 0 0-13.6"></path></svg></sc-if><sc-if value="{{n.ic_research}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5M10.5 7.5v6M7.5 10.5h6"></path></svg></sc-if><sc-if value="{{n.ic_users}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path><circle cx="16.8" cy="9.5" r="2.5"></circle><path d="M16.5 14c2.2 0 3.8 1.5 4.3 4"></path></svg></sc-if><sc-if value="{{n.ic_bell}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 5.5 2.5 7.5 2.5 7.5H4s2.5-2 2.5-7.5"></path><path d="M10.2 20.5a2 2 0 0 0 3.6 0"></path></svg></sc-if><sc-if value="{{n.ic_heart}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></sc-if><sc-if value="{{n.ic_smile}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 14c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2M9 9.5h.01M15 9.5h.01"></path></svg></sc-if><sc-if value="{{n.ic_warn}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0"></path></svg></sc-if><sc-if value="{{n.ic_pin}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg></sc-if><sc-if value="{{n.ic_hash}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 7 20M17 4l-2 16M4.5 9h16M3.5 15h16"></path></svg></sc-if><sc-if value="{{n.ic_spark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 13.9 9 19.5 10.5 13.9 12.4 12 18 10.1 12.4 4.5 10.5 10.1 9z"></path></svg></sc-if><sc-if value="{{n.ic_pulse}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l3-7 4 14 3-7h5"></path></svg></sc-if><sc-if value="{{n.ic_search}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></sc-if><sc-if value="{{n.ic_calendar}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path></svg></sc-if><sc-if value="{{n.ic_arrow}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></sc-if><sc-if value="{{n.ic_chevron}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></sc-if><sc-if value="{{n.ic_external}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6H10"></path></svg></sc-if><sc-if value="{{n.ic_download}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></sc-if><sc-if value="{{n.ic_refresh}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"></path></svg></sc-if><sc-if value="{{n.ic_trend}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 9 11l4 4 8-8M15 7h6v6"></path></svg></sc-if><sc-if value="{{n.ic_shield}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg></sc-if></span>
        <span style="flex: 1; line-height: 1.3">{{n.label}}</span>
        <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span style="min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: #e5484d; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{n.badge}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <label for="q" style="font-size: 12px; font-weight: 500; color: #5b6478">Search</label>
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 14px; background: #ffffff; border: 1.5px solid {{accent}}; box-shadow: 0 6px 18px rgba(47,91,234,0.12); color: #5b6478">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" value="{{query}}" placeholder="Search any keyword…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: Montserrat, system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #101828">
    </div>
    <div style="font-size: 11px; line-height: 1.5; color: #5b6478">Type anything in Vietnamese – a product, a hospital, a symptom. Accents optional.</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{recent}}" as="r" hint-placeholder-count="3"><button type="button" class="chip" data-tap style="flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid rgba(47,91,234,0.14); background: rgba(255,255,255,0.8); color: #3b4459; font-family: Montserrat, system-ui, sans-serif; font-size: 12px; font-weight: 600; white-space: nowrap">{{r}}</button></sc-for></div>
    <button type="button" style="height: 42px; border-radius: 12px; border: 0; background: rgba(47,91,234,0.1); color: #1f43c4; font-family: Montserrat, system-ui, sans-serif; font-size: 13px; font-weight: 600">+ Track this keyword daily</button>
  </div>
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <legend style="font-size: 12px; font-weight: 500; color: #5b6478; padding: 0; margin-bottom: 10px">Date range</legend>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 500; color: #5b6478">From<input type="text" value="{{dateFrom}}" style="height: 42px; width: 100%; border-radius: 12px; border: 1px solid rgba(47,91,234,0.18); background: #ffffff; padding: 0 10px; font-family: Montserrat, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #101828"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 500; color: #5b6478">To<input type="text" value="{{dateTo}}" style="height: 42px; width: 100%; border-radius: 12px; border: 1px solid rgba(47,91,234,0.18); background: #ffffff; padding: 0 10px; font-family: Montserrat, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #101828"></label>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{presets}}" as="p" hint-placeholder-count="5"><button type="button" class="chip" data-tap style="flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid rgba(47,91,234,0.14); background: {{p.bg}}; color: {{p.ink}}; font-family: Montserrat, system-ui, sans-serif; font-size: 12px; font-weight: 600; white-space: nowrap">{{p.label}}</button></sc-for></div>
  </fieldset>
  <fieldset style="border: 0; margin: 0; padding: 0">
    <legend style="font-size: 12px; font-weight: 500; color: #5b6478; padding: 0; margin-bottom: 10px">Sources</legend>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{sources}}" as="s" hint-placeholder-count="6"><label class="chip" data-tap style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 16px; background: rgba(255,255,255,0.85); border: 1px solid rgba(47,91,234,0.14); font-size: 12px; font-weight: 500; color: #3b4459"><input type="checkbox" checked="checked" style="margin: 0; accent-color: {{accent}}"> {{s}}</label></sc-for></div>
  </fieldset>
  <div style="margin-top: auto; padding: 14px; border-radius: 16px; background: rgba(47,91,234,0.07); font-size: 12px; line-height: 1.6; color: #3b4459"><div style="font-weight: 600; color: #101828">Last scan 14:07 · 17/11</div>Crisis keywords hourly · everything else daily</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["listening", "communities", "research", "alerts"], "default": "listening"}, "industry": {"editor": "enum", "options": ["Mother &amp; Baby", "Healthcare"], "default": "Mother &amp; Baby"}, "query": {"editor": "text", "default": "sữa công thức"}, "dateFrom": {"editor": "text", "default": "01/10/2026"}, "dateTo": {"editor": "text", "default": "31/10/2026"}, "accent": {"editor": "color", "default": "#2f5bea", "options": ["#2f5bea", "#6250d6", "#0e9f6e", "#e8590c"]}, "$preview": {"width": 280, "height": 1260}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2f5bea';
    const active = this.props.active ?? 'listening';
    const industry = this.props.industry ?? 'Mother & Baby';
    const NAV = {"listening": [{"label": "Social Listening", "href": "Main.dc.html", "on": true, "badge": "", "color": "#2f5bea", "tint": "rgba(47,91,234,0.32)", "inner": "rgba(47,91,234,0.16)", "ic_listening": true, "bg": "#ffffff", "ink": "#101828", "weight": 700, "shadow": "0 10px 24px rgba(47,91,234,0.16)"}, {"label": "Communities", "href": "Communities.dc.html", "on": false, "badge": "", "color": "#d6336c", "tint": "rgba(214,51,108,0.16)", "inner": "rgba(214,51,108,0.16)", "ic_users": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Marketing Research", "href": "Research.dc.html", "on": false, "badge": "", "color": "#e8590c", "tint": "rgba(232,89,12,0.16)", "inner": "rgba(232,89,12,0.16)", "ic_research": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Alerts", "href": "Alerts.dc.html", "on": false, "badge": "5", "color": "#c27c00", "tint": "rgba(245,159,0,0.16)", "inner": "rgba(245,159,0,0.16)", "ic_bell": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}], "communities": [{"label": "Social Listening", "href": "Main.dc.html", "on": false, "badge": "", "color": "#2f5bea", "tint": "rgba(47,91,234,0.16)", "inner": "rgba(47,91,234,0.16)", "ic_listening": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Communities", "href": "Communities.dc.html", "on": true, "badge": "", "color": "#d6336c", "tint": "rgba(214,51,108,0.32)", "inner": "rgba(214,51,108,0.16)", "ic_users": true, "bg": "#ffffff", "ink": "#101828", "weight": 700, "shadow": "0 10px 24px rgba(214,51,108,0.16)"}, {"label": "Marketing Research", "href": "Research.dc.html", "on": false, "badge": "", "color": "#e8590c", "tint": "rgba(232,89,12,0.16)", "inner": "rgba(232,89,12,0.16)", "ic_research": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Alerts", "href": "Alerts.dc.html", "on": false, "badge": "5", "color": "#c27c00", "tint": "rgba(245,159,0,0.16)", "inner": "rgba(245,159,0,0.16)", "ic_bell": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}], "research": [{"label": "Social Listening", "href": "Main.dc.html", "on": false, "badge": "", "color": "#2f5bea", "tint": "rgba(47,91,234,0.16)", "inner": "rgba(47,91,234,0.16)", "ic_listening": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Communities", "href": "Communities.dc.html", "on": false, "badge": "", "color": "#d6336c", "tint": "rgba(214,51,108,0.16)", "inner": "rgba(214,51,108,0.16)", "ic_users": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Marketing Research", "href": "Research.dc.html", "on": true, "badge": "", "color": "#e8590c", "tint": "rgba(232,89,12,0.32)", "inner": "rgba(232,89,12,0.16)", "ic_research": true, "bg": "#ffffff", "ink": "#101828", "weight": 700, "shadow": "0 10px 24px rgba(232,89,12,0.16)"}, {"label": "Alerts", "href": "Alerts.dc.html", "on": false, "badge": "5", "color": "#c27c00", "tint": "rgba(245,159,0,0.16)", "inner": "rgba(245,159,0,0.16)", "ic_bell": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}], "alerts": [{"label": "Social Listening", "href": "Main.dc.html", "on": false, "badge": "", "color": "#2f5bea", "tint": "rgba(47,91,234,0.16)", "inner": "rgba(47,91,234,0.16)", "ic_listening": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Communities", "href": "Communities.dc.html", "on": false, "badge": "", "color": "#d6336c", "tint": "rgba(214,51,108,0.16)", "inner": "rgba(214,51,108,0.16)", "ic_users": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Marketing Research", "href": "Research.dc.html", "on": false, "badge": "", "color": "#e8590c", "tint": "rgba(232,89,12,0.16)", "inner": "rgba(232,89,12,0.16)", "ic_research": true, "bg": "transparent", "ink": "#3b4459", "weight": 500, "shadow": "none"}, {"label": "Alerts", "href": "Alerts.dc.html", "on": true, "badge": "5", "color": "#c27c00", "tint": "rgba(245,159,0,0.32)", "inner": "rgba(245,159,0,0.16)", "ic_bell": true, "bg": "#ffffff", "ink": "#101828", "weight": 700, "shadow": "0 10px 24px rgba(245,159,0,0.16)"}]};
    return {
      accent, query: this.props.query ?? 'sữa công thức',
      dateFrom: this.props.dateFrom ?? '01/10/2026', dateTo: this.props.dateTo ?? '31/10/2026',
      industries: ['Mother & Baby', 'Healthcare'].map((label) => ({ label, on: label === industry, off: label !== industry })),
      nav: NAV[active] || NAV.listening,

      presets: ["7D", "30D", "This month", "YTD", "Custom"].map((label) => ({ label, bg: label === 'Custom' ? accent : 'rgba(255,255,255,0.85)', ink: label === 'Custom' ? '#ffffff' : '#3b4459' })),
      sources: ["Facebook", "TikTok", "YouTube", "News", "Threads", "Instagram"],
    };
  }
}
</script>
</body>
</html>
